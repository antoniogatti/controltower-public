<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control Tower Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0d14;
      --text: #f4f7ff;
      --muted: #a8b2c8;
      --line: rgba(255,255,255,.14);
      --public: #56d3ff;
      --private: #8b7dff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 520px at -10% -10%, rgba(86,211,255,.2), transparent 45%),
        radial-gradient(900px 520px at 110% -20%, rgba(139,125,255,.2), transparent 45%),
        var(--bg);
    }
    .wrap { max-width: 1080px; margin: 0 auto; }
    h1 { margin: 0 0 6px; letter-spacing: -.02em; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
    .card {
      display: block; text-decoration: none; color: inherit;
      border: 1px solid var(--line); border-radius: 14px; padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
      transition: transform .12s ease, border-color .12s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .badge { display: inline-block; font-size: .72rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; margin-bottom: 8px; }
    .b-public { background: rgba(86,211,255,.2); border: 1px solid rgba(86,211,255,.55); color: #d9f7ff; }
    .b-private { background: rgba(139,125,255,.2); border: 1px solid rgba(139,125,255,.55); color: #e4dcff; }
    h3 { margin: 4px 0 8px; }
    p { margin: 0; color: #c3cce0; }
    .list { margin-top: 10px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Control Tower Portal</h1>
    <p class="sub">Public + private entry points in one place.</p>

    <section class="grid">
      <a class="card" href="./skiathos-trip.html">
        <span class="badge b-public">Public</span>
        <h3>Skiathos Trip Dashboard</h3>
        <p>Open the public travel dashboard.</p>
      </a>

      <a class="card" href="https://github.com/antoniogatti/controltower-html">
        <span class="badge b-private">Private</span>
        <h3>Private Dashboards Repo</h3>
        <p>Access-controlled repo (GitHub login required).</p>
        <div class="list">Enel · Moto · PayPal</div>
      </a>
    </section>
  </main>
</body>
</html>
