<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Control Tower Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0d14;
      --text: #f4f7ff;
      --muted: #a8b2c8;
      --line: rgba(255,255,255,.14);
      --public: #56d3ff;
      --private: #8b7dff;
      --card: rgba(255,255,255,.04);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      background:
        radial-gradient(760px 420px at -10% -10%, rgba(86,211,255,.17), transparent 45%),
        radial-gradient(760px 420px at 110% -20%, rgba(139,125,255,.17), transparent 45%),
        var(--bg);
    }

    .wrap { width: 100%; max-width: 920px; margin: 0 auto; }

    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 1.1vw + .85rem, 1.5rem);
      letter-spacing: -.02em;
      line-height: 1.1;
    }

    .sub {
      margin: 0 0 10px;
      color: var(--muted);
      line-height: 1.35;
      font-size: clamp(.82rem, .2vw + .78rem, .9rem);
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      padding: 10px 11px;
      min-height: 58px;
      -webkit-tap-highlight-color: transparent;
    }

    .item:active { transform: translateY(1px); }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      flex: 0 0 auto;
    }

    .public .dot { background: var(--public); box-shadow: 0 0 0 4px rgba(86,211,255,.18); }
    .private .dot { background: var(--private); box-shadow: 0 0 0 4px rgba(139,125,255,.18); }

    .text { min-width: 0; }
    .title {
      margin: 0;
      font-size: .93rem;
      line-height: 1.25;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .desc {
      margin: 2px 0 0;
      color: #c2cce0;
      font-size: .79rem;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .02em;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .public .tag { color: #d6f7ff; background: rgba(86,211,255,.17); border-color: rgba(86,211,255,.45); }
    .private .tag { color: #e5deff; background: rgba(139,125,255,.17); border-color: rgba(139,125,255,.45); }

    .footer {
      margin-top: 10px;
      color: var(--muted);
      font-size: .74rem;
      line-height: 1.3;
    }

    @media (max-width: 430px) {
      body { padding: 10px 10px 12px; }
      .top { margin-bottom: 8px; }
      .sub { margin-bottom: 8px; font-size: .78rem; }
      .item { padding: 9px 9px; border-radius: 10px; gap: 8px; min-height: 52px; }
      .title { font-size: .88rem; }
      .desc { font-size: .74rem; }
      .tag { font-size: .63rem; padding: 2px 6px; }
      .dot { width: 8px; height: 8px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1>Control Tower</h1>
    </div>
    <p class="sub">Fast mobile launcher (public + private).</p>

    <section class="list">
      <a class="item public" href="./skiathos-trip.html">
        <span class="dot" aria-hidden="true"></span>
        <div class="text">
          <p class="title">Skiathos Trip Dashboard</p>
          <p class="desc">Public travel page</p>
        </div>
        <span class="tag">PUBLIC</span>
      </a>

      <a class="item private" href="https://github.com/antoniogatti/controltower-html">
        <span class="dot" aria-hidden="true"></span>
        <div class="text">
          <p class="title">Private Dashboards</p>
          <p class="desc">Enel · Moto · PayPal (login required)</p>
        </div>
        <span class="tag">PRIVATE</span>
      </a>
    </section>

    <div class="footer">Tip: add this page to home screen.</div>
  </main>
</body>
</html>
